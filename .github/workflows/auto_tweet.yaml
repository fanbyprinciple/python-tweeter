name: Auto Tweet YouTube Summary

on:
  push:
    branches:
      - main
    paths:
      - "videos.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tweet_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show changed files debug
        run: |
          echo "Changed files in this commit:"
          git diff --name-only HEAD^ HEAD || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install youtube-transcript-api openai tweepy pyyaml python-dotenv

      - name: Run YouTube Summariser
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: |
          echo "Running youtube_summariser.py..."
          python youtube_summariser.py
        continue-on-error: false

      - name: Print bot.log
        if: always()
        run: |
          echo "===== BOT LOG START ====="
          cat bot.log || echo "bot.log not found."
          echo "===== BOT LOG END ====="

      - name: Commit processed_videos.txt
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: processed_videos.txt
          commit_message: "Auto: updated processed videos log"
