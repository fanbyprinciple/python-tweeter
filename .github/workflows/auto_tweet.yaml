name: Auto Tweet YouTube Summary

on:
  push:
    paths:
      - 'videos.txt'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  tweet_job:
    runs-on: ubuntu-22.04   # safer + avoids the Python-3.1 issue
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install youtube-transcript-api openai tweepy pyyaml python-dotenv

      - name: Run YouTube Summarizer and Tweet
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: python youtube_summariser.py

      - name: Commit Processed Log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: processed_videos.txt
          commit_message: "Auto-Committed: Updated processed video log"
